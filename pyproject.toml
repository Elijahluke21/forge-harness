[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "forge-harness"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=0.49.0",
    "openai>=1.0.0",
    "rich>=13.0.0",
    "pyyaml>=6.0",
]

[project.scripts]
forge = "harness.cli:cli"

[tool.setuptools.packages.find]
where = ["."]
include = ["harness*"]
